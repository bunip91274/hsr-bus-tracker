<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7A003C">
  <title>Res Bus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Res Bus</h1>
    <select id="residence" aria-label="Your residence"></select>
  </header>

  <p id="status" class="status" role="status"></p>
  <main id="stops"></main>

  <footer>
    Data: City of Hamilton open data (HSR GTFS). Not affiliated with HSR or McMaster.
  </footer>

  <template id="stop-tpl">
    <section class="stop">
      <div class="stop-head">
        <h2 class="stop-name"></h2>
        <span class="walk"></span>
      </div>
      <ul class="deps"></ul>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
