[project]
name = "res-bus"
version = "0.1.0"
description = "HSR trip planner for McMaster residences: when to leave, which bus, live ETAs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maksym Pronin" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
